<svg width="580" height="340" viewBox="0 0 580 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="580" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#133861"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" stroke="#d0ebff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .f{font-family:'Segoe UI', Ubuntu, Arial, sans-serif;}
      .k{font-size:13px;letter-spacing:1.6px;fill:#a9d1ff;}
      .h{font-size:26px;font-weight:700;fill:#fff;}
      .p{font-size:16px;fill:#dcecff;}
      .tag{font-size:13px;fill:#d0ebff;}
      .box{fill:rgba(116,192,255,.12);stroke:rgba(116,192,255,.30);stroke-width:1;}
      .line{stroke:#74c0ff;stroke-width:2.2;fill:none;stroke-dasharray:8 8;animation:dash 9s linear infinite;}
      .glow{animation:blink 2.2s ease-in-out infinite;}
      @keyframes dash{to{stroke-dashoffset:-180}}
      @keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
    </style>
  </defs>
  <rect width="580" height="340" rx="24" fill="url(#bg)"/>
  <rect width="580" height="340" rx="24" fill="url(#grid)"/>

  <text x="28" y="38" class="f k">SPEECH AI · MODEL ADAPTATION</text>
  <text x="28" y="84" class="f h">Pocket TTS →</text>
  <text x="28" y="114" class="f h">Classical Arabic</text>
  <text x="28" y="152" class="f p">Romanization · Flow Matching · LoRA ·</text>
  <text x="28" y="176" class="f p">Audio latents · Reproducible training</text>
  <rect x="28" y="246" width="110" height="30" rx="12" class="box"/><text x="45" y="265" class="f tag">Speech AI</text>
  <rect x="146" y="246" width="110" height="30" rx="12" class="box"/><text x="167" y="265" class="f tag">PyTorch</text>
  <rect x="264" y="246" width="136" height="30" rx="12" class="box"/><text x="286" y="265" class="f tag">Fine-tuning</text>
  <path d="M355 93C390 93 410 110 432 126C451 140 472 152 511 152" class="line"/>
  <path d="M355 162C390 162 410 180 432 197C451 211 472 223 511 223" class="line"/>
  <rect x="366" y="68" width="90" height="42" rx="14" class="box"/><text x="392" y="94" class="f tag">Text</text>
  <rect x="476" y="131" width="74" height="42" rx="14" class="box"/><text x="494" y="157" class="f tag">Flow</text>
  <rect x="366" y="198" width="90" height="42" rx="14" class="box"/><text x="388" y="224" class="f tag">Latents</text>
  <circle cx="355" cy="93" r="5" fill="#d0ebff" class="glow"/>
  <circle cx="511" cy="152" r="5" fill="#d0ebff" class="glow"/>
  <circle cx="355" cy="162" r="5" fill="#d0ebff" class="glow"/>
  <circle cx="511" cy="223" r="5" fill="#d0ebff" class="glow"/>
</svg>
