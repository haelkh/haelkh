<svg width="1200" height="140" viewBox="0 0 1200 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1200" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a1727"/>
      <stop offset="1" stop-color="#143a67"/>
    </linearGradient>
    <style>
      .f{font-family:'Segoe UI', Ubuntu, Arial, sans-serif;}
      .chip{fill:rgba(116,192,255,0.12);stroke:rgba(116,192,255,0.35);stroke-width:1.2;}
      .t{font-size:18px;fill:#e6f4ff;font-weight:600;}
      .s{font-size:14px;fill:#b9d8fb;letter-spacing:1.3px;}
      .move{animation: updown 5s ease-in-out infinite;}
      .m2{animation-delay:.5s}.m3{animation-delay:1s}.m4{animation-delay:1.5s}.m5{animation-delay:2s}
      @keyframes updown {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    </style>
  </defs>
  <rect width="1200" height="140" rx="24" fill="url(#g)"/>
  <text x="36" y="38" class="f s">SPECIALIZATION FOCUS</text>
  <g class="move">
    <rect x="36" y="56" width="176" height="50" rx="16" class="chip"/>
    <text x="64" y="87" class="f t">LLM Systems</text>
  </g>
  <g class="move m2">
    <rect x="228" y="56" width="212" height="50" rx="16" class="chip"/>
    <text x="258" y="87" class="f t">Agentic Workflows</text>
  </g>
  <g class="move m3">
    <rect x="456" y="56" width="150" height="50" rx="16" class="chip"/>
    <text x="508" y="87" class="f t">RAG</text>
  </g>
  <g class="move m4">
    <rect x="622" y="56" width="184" height="50" rx="16" class="chip"/>
    <text x="656" y="87" class="f t">Applied ML</text>
  </g>
  <g class="move m5">
    <rect x="822" y="56" width="338" height="50" rx="16" class="chip"/>
    <text x="854" y="87" class="f t">Backend Engineering &amp; APIs</text>
  </g>
</svg>
