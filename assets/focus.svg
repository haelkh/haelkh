<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="68" viewBox="0 0 1000 68" role="img" aria-label="Building AI agents, retrieval systems, applied machine learning and full stack products">
<defs><style><![CDATA[
text{font-family:Consolas,Menlo,monospace;font-size:23px;font-weight:600;letter-spacing:.2px}
.a{animation:one 16s infinite}.b{opacity:0;animation:two 16s infinite}.c{opacity:0;animation:three 16s infinite}.d{opacity:0;animation:four 16s infinite}
@keyframes one{0%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes two{0%,24%{opacity:0}26%,47%{opacity:1}50%,100%{opacity:0}}
@keyframes three{0%,49%{opacity:0}51%,72%{opacity:1}75%,100%{opacity:0}}
@keyframes four{0%,74%{opacity:0}76%,97%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.a,.b,.c,.d{animation:none}.b,.c,.d{opacity:0}}
]]></style></defs>
<text x="500" y="42" text-anchor="middle" fill="#43DABA" class="a">Designing agentic AI workflows &amp; orchestration</text>
<text x="500" y="42" text-anchor="middle" fill="#7BBAFF" class="b">Making retrieval and language models useful</text>
<text x="500" y="42" text-anchor="middle" fill="#C09BFF" class="c">Building end-to-end AI-powered products</text>
<text x="500" y="42" text-anchor="middle" fill="#71E4D6" class="d">Experimenting, shipping, and learning daily</text>
</svg>