<svg width="580" height="340" viewBox="0 0 580 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="580" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#133861"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" stroke="#d0ebff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .f{font-family:'Segoe UI', Ubuntu, Arial, sans-serif;}
      .k{font-size:13px;letter-spacing:1.6px;fill:#a9d1ff;}
      .h{font-size:26px;font-weight:700;fill:#fff;}
      .p{font-size:16px;fill:#dcecff;}
      .tag{font-size:13px;fill:#d0ebff;}
      .box{fill:rgba(116,192,255,.12);stroke:rgba(116,192,255,.30);stroke-width:1;}
      .line{stroke:#74c0ff;stroke-width:2.2;fill:none;stroke-dasharray:8 8;animation:dash 9s linear infinite;}
      .glow{animation:blink 2.2s ease-in-out infinite;}
      @keyframes dash{to{stroke-dashoffset:-180}}
      @keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
    </style>
  </defs>
  <rect width="580" height="340" rx="24" fill="url(#bg)"/>
  <rect width="580" height="340" rx="24" fill="url(#grid)"/>

  <text x="28" y="38" class="f k">TIME SERIES · PREDICTIVE MODELING</text>
  <text x="28" y="84" class="f h">Financial</text>
  <text x="28" y="114" class="f h">Time-Series ML</text>
  <text x="28" y="152" class="f p">LSTM · Random Forest · Feature engineering ·</text>
  <text x="28" y="176" class="f p">Data pipeline for market-direction analysis</text>
  <rect x="28" y="246" width="118" height="30" rx="12" class="box"/><text x="51" y="265" class="f tag">Time Series</text>
  <rect x="156" y="246" width="136" height="30" rx="12" class="box"/><text x="178" y="265" class="f tag">TensorFlow</text>
  <rect x="302" y="246" width="112" height="30" rx="12" class="box"/><text x="324" y="265" class="f tag">sklearn</text>
  <path d="M360 220L390 200L417 208L445 170L475 180L505 128L540 148" stroke="#d0ebff" stroke-width="3" fill="none"/>
  <path d="M360 234L390 210L417 224L445 181L475 198L505 140L540 168" class="line"/>
  <line x1="360" y1="90" x2="360" y2="260" stroke="#9dd4ff" stroke-opacity="0.4"/>
  <line x1="360" y1="260" x2="545" y2="260" stroke="#9dd4ff" stroke-opacity="0.4"/>
  <circle cx="390" cy="200" r="4.8" fill="#74c0ff" class="glow"/><circle cx="417" cy="208" r="4.8" fill="#74c0ff" class="glow"/><circle cx="445" cy="170" r="4.8" fill="#74c0ff" class="glow"/><circle cx="475" cy="180" r="4.8" fill="#74c0ff" class="glow"/><circle cx="505" cy="128" r="4.8" fill="#74c0ff" class="glow"/><circle cx="540" cy="148" r="4.8" fill="#74c0ff" class="glow"/>
