<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f2d55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#74c0ff"/>
      <stop offset="1" stop-color="#4dabf7"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d0ebff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4dabf7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" stroke="#d0ebff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .f { font-family: 'Segoe UI', Ubuntu, Arial, sans-serif; }
      .small { font-size: 18px; letter-spacing: 2px; fill: #b6d4f7; }
      .title { font-size: 38px; font-weight: 700; fill: white; }
      .subtitle { font-size: 18px; fill: #dcecff; }
      .label { font-size: 15px; fill: #c8e1ff; }
      .chip { fill: rgba(116,192,255,0.12); stroke: rgba(116,192,255,0.35); stroke-width: 1; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: center; }
      .floaty { animation: floaty 6s ease-in-out infinite; }
      .flow1 { stroke-dasharray: 10 12; animation: dash 10s linear infinite; }
      .flow2 { stroke-dasharray: 8 10; animation: dash 8s linear infinite reverse; }
      .node { animation: blink 2.6s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -300; } }
      @keyframes pulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
      @keyframes floaty { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes blink { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1090" cy="85" r="170" fill="#4dabf7" fill-opacity="0.08" class="pulse"/>
  <circle cx="1090" cy="85" r="122" fill="#74c0ff" fill-opacity="0.06" class="pulse"/>

  <text x="70" y="78" class="f small">AI ENGINEER · LLM SYSTEMS · AGENTS · APPLIED MACHINE LEARNING</text>
  <text x="70" y="138" class="f title">Hassan Elkhatib</text>
  <text x="70" y="182" class="f subtitle">I engineer LLM applications, agentic workflows, and applied machine learning.</text>
  <text x="70" y="212" class="f subtitle">From intelligent retrieval to backend APIs, evaluation, and product delivery.</text>

  <g class="floaty">
    <rect x="70" y="248" rx="16" ry="16" width="150" height="40" class="chip"/>
    <rect x="232" y="248" rx="16" ry="16" width="164" height="40" class="chip"/>
    <rect x="408" y="248" rx="16" ry="16" width="128" height="40" class="chip"/>
    <rect x="548" y="248" rx="16" ry="16" width="150" height="40" class="chip"/>
    <rect x="710" y="248" rx="16" ry="16" width="138" height="40" class="chip"/>
    <text x="95" y="273" class="f label">LLM Systems</text>
    <text x="258" y="273" class="f label">Agent Workflows</text>
    <text x="448" y="273" class="f label">RAG</text>
    <text x="582" y="273" class="f label">Applied ML</text>
    <text x="741" y="273" class="f label">APIs &amp; Data</text>
  </g>

  <g filter="url(#glow)">
    <path d="M820 220C860 160 905 138 960 136C1005 135 1042 152 1074 183C1105 214 1140 226 1187 223" stroke="url(#accent)" stroke-width="3.2" fill="none" class="flow1" stroke-linecap="round"/>
    <path d="M840 120C873 98 912 87 954 91C1007 95 1052 119 1091 160C1128 198 1162 217 1210 228" stroke="url(#accent2)" stroke-width="2.8" fill="none" class="flow2" stroke-linecap="round"/>
    <path d="M832 275C883 250 931 244 981 253C1030 262 1084 282 1138 290" stroke="#74c0ff" stroke-opacity="0.75" stroke-width="2.4" fill="none" class="flow2"/>

    <g>
      <line x1="905" y1="120" x2="981" y2="84" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="905" y1="120" x2="978" y2="150" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="905" y1="120" x2="980" y2="215" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="981" y1="84" x2="1067" y2="116" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="981" y1="84" x2="1063" y2="194" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="978" y1="150" x2="1067" y2="116" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="978" y1="150" x2="1063" y2="194" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="980" y1="215" x2="1063" y2="194" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="980" y1="215" x2="1066" y2="270" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="1067" y1="116" x2="1160" y2="155" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="1063" y1="194" x2="1160" y2="155" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="1063" y1="194" x2="1158" y2="235" stroke="#9dd4ff" stroke-opacity="0.75"/>
      <line x1="1066" y1="270" x2="1158" y2="235" stroke="#9dd4ff" stroke-opacity="0.75"/>

      <circle cx="905" cy="120" r="6" fill="#d0ebff" class="node"/><circle cx="981" cy="84" r="6" fill="#d0ebff" class="node"/><circle cx="978" cy="150" r="6" fill="#d0ebff" class="node"/><circle cx="980" cy="215" r="6" fill="#d0ebff" class="node"/><circle cx="1067" cy="116" r="6" fill="#d0ebff" class="node"/><circle cx="1063" cy="194" r="6" fill="#d0ebff" class="node"/><circle cx="1066" cy="270" r="6" fill="#d0ebff" class="node"/><circle cx="1160" cy="155" r="6" fill="#d0ebff" class="node"/><circle cx="1158" cy="235" r="6" fill="#d0ebff" class="node"/>
    </g>
  </g>
</svg>
