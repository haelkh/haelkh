<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="388" viewBox="0 0 1200 388" role="img" aria-label="Hassan Elkhatib — AI Engineer. Building intelligent systems from models to production.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080E1D"/><stop offset=".65" stop-color="#10152C"/><stop offset="1" stop-color="#07141E"/></linearGradient>
  <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#53F4CE"/><stop offset=".56" stop-color="#67A8FF"/><stop offset="1" stop-color="#B98AFF"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#46EED0" stop-opacity=".22"/><stop offset="1" stop-color="#46EED0" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="21"/></filter>
  <clipPath id="frame"><rect width="1200" height="388" rx="21"/></clipPath>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9BB9DA" stroke-opacity=".055" stroke-width=".85"/></pattern>
  <style><![CDATA[
  @keyframes orbit { to { transform:rotate(360deg) } }
  @keyframes rev { to { transform:rotate(-360deg) } }
  @keyframes flicker { 0%,45%,100%{opacity:1} 50%,95%{opacity:.13} }
  @keyframes bob { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-5px)} }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  .orbit { transform-origin:982px 187px; animation:orbit 30s linear infinite; }
  .orbit-rev { transform-origin:982px 187px; animation:rev 24s linear infinite; }
  .cursor { animation:flicker 1.1s step-end infinite; }
  .bob { animation:bob 6s ease-in-out infinite; }
  .pulse { animation:pulse 3.5s ease-in-out infinite; }
  @media (prefers-reduced-motion:reduce){ .orbit,.orbit-rev,.cursor,.bob,.pulse{animation:none} }
  ]]></style>
</defs>
<g clip-path="url(#frame)">
 <rect width="1200" height="388" fill="url(#bg)"/>
 <rect width="1200" height="388" fill="url(#grid)"/>
 <circle cx="1040" cy="155" r="320" fill="url(#glow)"/>
 <ellipse cx="1000" cy="220" rx="180" ry="80" fill="#5474D0" opacity=".12" filter="url(#blur)"/>
 <rect x=".75" y=".75" width="1198.5" height="386.5" rx="20" fill="none" stroke="#6C83AF" stroke-opacity=".32" stroke-width="1.5"/>
 <path d="M55 27H113M55 27V47M1145 340V361H1093" fill="none" stroke="#58EACB" stroke-opacity=".8" stroke-width="2"/>
 <circle cx="67" cy="67" r="4" fill="#57F2CD"/><text x="81" y="72" font-size="13" fill="#A1B5D6" font-family="Consolas,Menlo,monospace" letter-spacing="2">ENGINEER / RESEARCHER / BUILDER</text>
 <rect x="55" y="99" width="4" height="114" rx="2" fill="url(#aurora)"/>
 <text x="75" y="147" fill="#F3F9FF" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="55" letter-spacing="-1.6">HASSAN</text>
 <text x="75" y="206" fill="url(#aurora)" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="55" letter-spacing="-1.6">ELKHATIB</text>
 <text x="75" y="246" fill="#D0DDEE" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="500">AI Engineer  <tspan fill="#536987">/</tspan>  LLM Systems  <tspan fill="#536987">/</tspan>  Intelligent Automation</text>
 <rect x="75" y="274" width="608" height="41" rx="9" fill="#13273B" stroke="#35546D" stroke-opacity=".72"/>
 <circle cx="96" cy="294" r="3.5" fill="#65F5D3"/>
 <text x="113" y="300" fill="#BFEBDD" font-family="Consolas,Menlo,monospace" font-size="15">$ build systems that make intelligence useful</text>
 <rect x="645" y="287" width="8" height="16" fill="#67F5D2" class="cursor"/>
 <g font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="1.4" fill="#94AAC8">
  <text x="75" y="351">AGENTS &amp; ORCHESTRATION</text><circle cx="281" cy="347" r="2" fill="#55E7CF"/>
  <text x="298" y="351">RETRIEVAL &amp; SEARCH</text><circle cx="490" cy="347" r="2" fill="#55E7CF"/>
  <text x="506" y="351">APPLIED ML</text>
 </g>
 <!-- Right-side system diagram -->
 <g class="orbit" fill="none" stroke="#72C7D9" stroke-opacity=".33"><ellipse cx="982" cy="187" rx="137" ry="121" stroke-width="1.2" stroke-dasharray="7 9"/><circle cx="982" cy="187" r="93" stroke="#85A1E7" stroke-opacity=".26"/></g>
 <g class="orbit-rev" fill="none" stroke="#8A92E8" stroke-opacity=".4"><ellipse cx="982" cy="187" rx="160" ry="85" transform="rotate(-24 982 187)" stroke-width="1.2" stroke-dasharray="2 10"/></g>
 <g stroke="#65DCCF" stroke-opacity=".47" stroke-width="1.6">
 <path d="M982 187 L878 126 M982 187 L1083 122 M982 187 L1095 250 M982 187 L864 258"/>
 </g>
 <g class="bob"><path d="M982 127 1035 157V217L982 247 929 217V157Z" fill="#122C3B" stroke="url(#aurora)" stroke-width="2"/><path d="M982 146 1018 167V207L982 228 946 207V167Z" fill="none" stroke="#65E9D4" opacity=".4"/><text x="982" y="185" text-anchor="middle" fill="#E9FEFF" font-family="Arial,sans-serif" font-size="21" font-weight="700">AI</text><text x="982" y="202" text-anchor="middle" fill="#85EAD8" font-family="Consolas,monospace" font-size="8.5" letter-spacing="1">SYSTEMS</text></g>
 <g font-family="Consolas,Menlo,monospace" font-size="13" text-anchor="middle">
  <g><circle cx="865" cy="126" r="28" fill="#0E2132" stroke="#4A92C0"/><text x="865" y="131" fill="#C7ECFF">LLMs</text></g>
  <g><circle cx="1097" cy="122" r="29" fill="#0E2132" stroke="#7697DC"/><text x="1097" y="127" fill="#D3E1FF">RAG</text></g>
  <g><circle cx="1102" cy="258" r="32" fill="#0E2132" stroke="#805EC1"/><text x="1102" y="263" fill="#D9CAFF">API</text></g>
  <g><circle cx="859" cy="261" r="32" fill="#0E2132" stroke="#45D4B2"/><text x="859" y="266" fill="#B5FFE8">ML</text></g>
 </g>
 <g class="pulse"><circle cx="982" cy="55" r="5" fill="#75F9DA"/><circle cx="1134" cy="196" r="3" fill="#B9A0FF"/><circle cx="838" cy="201" r="4" fill="#72A7FC"/></g>
 <text x="982" y="350" text-anchor="middle" fill="#6989A8" font-size="10" letter-spacing="3" font-family="Consolas,monospace">DESIGN  ·  SHIP  ·  ITERATE</text>
 <rect x="0" y="384" width="1200" height="4" fill="url(#aurora)" opacity=".85"/>
</g>
</svg>