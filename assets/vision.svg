<svg width="580" height="340" viewBox="0 0 580 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="580" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#133861"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" stroke="#d0ebff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .f{font-family:'Segoe UI', Ubuntu, Arial, sans-serif;}
      .k{font-size:13px;letter-spacing:1.6px;fill:#a9d1ff;}
      .h{font-size:26px;font-weight:700;fill:#fff;}
      .p{font-size:16px;fill:#dcecff;}
      .tag{font-size:13px;fill:#d0ebff;}
      .box{fill:rgba(116,192,255,.12);stroke:rgba(116,192,255,.30);stroke-width:1;}
      .line{stroke:#74c0ff;stroke-width:2.2;fill:none;stroke-dasharray:8 8;animation:dash 9s linear infinite;}
      .glow{animation:blink 2.2s ease-in-out infinite;}
      @keyframes dash{to{stroke-dashoffset:-180}}
      @keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
    </style>
  </defs>
  <rect width="580" height="340" rx="24" fill="url(#bg)"/>
  <rect width="580" height="340" rx="24" fill="url(#grid)"/>

  <text x="28" y="38" class="f k">COMPUTER VISION · EXPLAINABILITY</text>
  <text x="28" y="84" class="f h">Explainable Chest</text>
  <text x="28" y="114" class="f h">X-ray AI</text>
  <text x="28" y="152" class="f p">Training · Evaluation · Grad-CAM ·</text>
  <text x="28" y="176" class="f p">Inspection of model behavior</text>
  <rect x="28" y="246" width="140" height="30" rx="12" class="box"/><text x="49" y="265" class="f tag">Computer Vision</text>
  <rect x="176" y="246" width="96" height="30" rx="12" class="box"/><text x="201" y="265" class="f tag">PyTorch</text>
  <rect x="280" y="246" width="126" height="30" rx="12" class="box"/><text x="303" y="265" class="f tag">Grad-CAM</text>
  <rect x="370" y="65" width="155" height="190" rx="20" class="box"/>
  <rect x="397" y="90" width="101" height="135" rx="18" fill="#dcecff" fill-opacity="0.10" stroke="#9dd4ff" stroke-opacity="0.6"/>
  <ellipse cx="448" cy="145" rx="30" ry="50" fill="#ffffff" fill-opacity="0.06" stroke="#9dd4ff" stroke-opacity="0.4"/>
  <path d="M395 219C420 189 474 176 500 206" stroke="#74c0ff" stroke-width="20" stroke-linecap="round" stroke-opacity="0.4" class="glow"/>
  <path d="M388 108C430 89 473 89 507 122" class="line"/>
</svg>
